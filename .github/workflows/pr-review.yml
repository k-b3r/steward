name: pr-review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
  issue_comment:
    types: [created]

jobs:
  review:
    uses: k-b3r/agent-config/.github/workflows/pr-review.yml@main
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
      actions: write
    with:
      # Same value as pr-upkeep.yml's regenerate-paths, e.g. docs-site
      generated-paths: ''
    secrets: inherit
